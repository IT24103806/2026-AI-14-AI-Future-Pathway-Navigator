<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta
      name="description"
      content="PathwayNavigator — AI-assisted career guidance for Sri Lankan students. Ranked, evidence-backed pathways, tracked roadmaps and human counsellor review."
    />
    <meta name="theme-color" content="#04060f" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#eef2fb" media="(prefers-color-scheme: light)" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Sora:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />

    <title>PathwayNavigator · Navigate your future with confidence</title>

    <script>
      // Apply the persisted theme before first paint so there is no light/dark flash.
      (function () {
        try {
          var stored = window.localStorage.getItem('pathwaynavigator-theme');
          var prefersLight =
            window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches;
          var theme = stored === 'light' || stored === 'dark' ? stored : prefersLight ? 'light' : 'dark';
          document.documentElement.dataset.theme = theme;
          document.documentElement.style.colorScheme = theme;
        } catch (error) {
          /* keep the default dark theme */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root">
      <!-- Replaced by React on mount; shown while the bundle boots. -->
      <div class="boot-splash">
        <div class="boot-splash__inner">
          <div class="boot-splash__mark">🧭</div>
          <strong>PathwayNavigator</strong>
          <div class="boot-splash__bar"></div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
