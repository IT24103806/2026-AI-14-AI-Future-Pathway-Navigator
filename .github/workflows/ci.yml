name: AI Future Pathway Navigator CI

# The pipeline triggers on every push and pull request to the main branch.
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  # Mandatory ASP.NET Core Backend Pipeline
  build-and-test-backend:
    name: Backend (ASP.NET Core) CI
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Setup .NET Core
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x' # Adjust to your specific .NET 8/7 version

    - name: Restore dependencies
      run: dotnet restore ./backend/PathwayNavigator.sln # Adjust path to your solution

    - name: Build the backend
      run: dotnet build ./backend/PathwayNavigator.sln --no-restore --configuration Release

    - name: Run automated backend tests
      run: |
        set +e
        # Publish the failing test output as a check annotation, not just in the log.
        dotnet test ./backend/PathwayNavigator.sln --no-build --configuration Release --verbosity normal > tests.txt 2>&1
        status=$?
        # Annotations are capped per message, so publish only the failure blocks,
        # folded into chunks that each fit.
        grep -E 'FAIL|Failed|Error Message|Assert|Expected|Actual|Stack Trace' tests.txt \
          | fold -w 3900 | tail -n 8 > failures.txt
        if [ ! -s failures.txt ]; then tail -c 3900 tests.txt | fold -w 3900 | tail -n 1 > failures.txt; fi
        while IFS= read -r chunk; do echo "::error::$chunk"; done < failures.txt
        exit $status

  # Encouraged React Web Application Pipeline
  build-and-test-web:
    name: Frontend (React) CI
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Install Dependencies
      working-directory: ./web/PathwayNavigator
      run: npm ci

    - name: Lint and Check Formatting
      working-directory: ./web/PathwayNavigator
      run: npm run lint

    - name: Run React component and integration tests
      working-directory: ./web/PathwayNavigator
      run: npm test

    - name: Build React Application
      working-directory: ./web/PathwayNavigator
      run: npm run build

  test-agent-4:
    name: AI Service (Python) Tests
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - name: Install AI service dependencies
      working-directory: ./ai_service
      run: pip install -r requirements.txt
    - name: Run AI service tests (agents + .NET contract)
      working-directory: ./ai_service
      run: pytest -q

  test-flutter-mobile:
    name: Flutter Android app (analyze, test, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./mobile/PathwayNavigator
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: '17'
    - uses: subosito/flutter-action@v2
      with:
        channel: stable
        cache: true
    - name: Restore Flutter packages
      run: flutter pub get
    - name: Analyze Flutter code
      run: |
        set +e
        # The job log is not always reachable (e.g. from restricted networks), so
        # publish the analyzer output as a single check annotation as well.
        flutter analyze > analysis.txt 2>&1
        status=$?
        tr -d '\r' < analysis.txt | tail -c 60000 | tr '\n' '\t' > analysis.flat
        echo "::error::$(cat analysis.flat)"
        exit $status
    - name: Run Flutter tests
      run: flutter test --coverage
    - name: Build debug APK (proves the Android project compiles)
      run: flutter build apk --debug --dart-define=API_BASE_URL=http://10.0.2.2:5081/api
    - name: Build release APK (HTTPS enforced at start-up)
      run: flutter build apk --release --dart-define=API_BASE_URL=https://api.example.invalid/api
