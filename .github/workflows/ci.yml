name: AI Future Pathway Navigator CI

# The pipeline triggers on every push and pull request to the main branch.
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  # Mandatory ASP.NET Core Backend Pipeline
  build-and-test-backend:
    name: Backend (ASP.NET Core) CI
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Setup .NET Core
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x' # Adjust to your specific .NET 8/7 version

    - name: Restore dependencies
      run: dotnet restore ./backend/PathwayNavigator.sln # Adjust path to your solution

    - name: Build the backend
      run: dotnet build ./backend/PathwayNavigator.sln --no-restore --configuration Release

    - name: Run automated backend tests
      run: dotnet test ./backend/PathwayNavigator.sln --no-build --configuration Release --verbosity normal

  # Encouraged React Web Application Pipeline
  build-and-test-web:
    name: Frontend (React) CI
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Install Dependencies
      working-directory: ./web/PathwayNavigator
      run: npm ci

    - name: Lint and Check Formatting
      working-directory: ./web/PathwayNavigator
      run: npm run lint

    - name: Run React component and integration tests
      working-directory: ./web/PathwayNavigator
      run: npm test

    - name: Build React Application
      working-directory: ./web/PathwayNavigator
      run: npm run build

  test-agent-4:
    name: AI Service (Python) Tests
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - name: Install AI service dependencies
      working-directory: ./ai_service
      run: pip install -r requirements.txt
    - name: Run AI service tests (agents + .NET contract)
      working-directory: ./ai_service
      run: pytest -q

  test-flutter-member-4:
    name: Flutter Member 4 Tests
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: subosito/flutter-action@v2
      with:
        channel: stable
    - name: Restore Flutter packages
      working-directory: ./mobile/PathwayNavigator
      run: flutter pub get
    - name: Analyze Flutter code
      working-directory: ./mobile/PathwayNavigator
      run: flutter analyze
    - name: Run Flutter tests
      working-directory: ./mobile/PathwayNavigator
      run: flutter test

